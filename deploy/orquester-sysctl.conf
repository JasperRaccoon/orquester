# Installed by deploy/install-unit.sh as /etc/sysctl.d/99-orquester.conf.
#
# CUBIC cuts its sending rate at every lost packet, and the default 4 MB send buffer caps what a
# long route can carry. A 549 MB download at 190 ms and 1% loss took about 23 minutes with both,
# about 98 seconds with BBR, and about 54 seconds with BBR and this buffer limit. The limit is only
# a ceiling: the kernel grows a connection's buffer when it needs it.
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_wmem = 4096 16384 67108864
