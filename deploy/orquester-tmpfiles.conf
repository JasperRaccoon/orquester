# Installed by deploy/install-unit.sh as /etc/tmpfiles.d/orquester.conf.
#
# tsx (which runs the daemon, the agent host and every TypeScript test) keeps one transpile-cache
# file per module version in $TMPDIR/tsx-<uid> — /var/lib/orquester/tmp for the service and its
# sessions — and lists that whole directory at every process start; it expires entries only after
# about 8 days. systemd-tmpfiles-clean.timer (daily) deletes the entries that nothing has read,
# written or changed for 2 days (relatime refreshes the atime of a file in use at least daily); a
# deleted entry is only a cache miss for a running process.
e /var/lib/orquester/tmp/tsx-* - - - 2d
